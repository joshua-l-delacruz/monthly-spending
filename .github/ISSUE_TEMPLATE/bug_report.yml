name: Bug report
description: Report a reproducible problem without sharing private financial data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include account numbers, credentials, or real financial records.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictional example values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
    validations:
      required: true
